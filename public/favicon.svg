<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>

  <!-- Outer compass ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.6"/>

  <!-- Cardinal tick marks -->
  <line x1="32" y1="10" x2="32" y2="15" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="32" y1="49" x2="32" y2="54" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="10" y1="32" x2="15" y2="32" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="49" y1="32" x2="54" y2="32" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- North needle (amber — pointing up) -->
  <polygon points="32,14 36.5,32 32,29 27.5,32" fill="#fbbf24"/>

  <!-- South needle (sky blue — pointing down) -->
  <polygon points="32,50 36.5,32 32,35 27.5,32" fill="#38bdf8" opacity="0.55"/>

  <!-- Center pivot -->
  <circle cx="32" cy="32" r="3.5" fill="#fbbf24"/>
  <circle cx="32" cy="32" r="1.8" fill="#0f172a"/>
</svg>
